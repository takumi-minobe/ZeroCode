<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>タスク編集</title>

    <style>
        body {
            background-color: #f5f5f5;
            font-family: sans-serif;
        }

        .container {
            width: 900px;
            margin: 60px auto;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 14px;
        }

        textarea {
            height: 70px;
        }

        .update-btn {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
            padding: 10px 16px;
            border-radius: 4px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>タスク編集</h1>

    <form th:action="@{/tasks/edit/{id}(id=${task.id})}"
          method="post">

        <input type="hidden"
               name="id"
               th:value="${task.id}">

        <label>タイトル</label>
        <input type="text"
               name="title"
               th:value="${task.title}">

        <label>内容</label>
        <textarea name="content"
                  th:text="${task.content}"></textarea>

        <label>登録者</label>
        <input type="text"
               name="name"
               th:value="${task.name}">

			   <label>開始日</label>
			   <input type="date"
			          name="startDate">

			   <label>終了日</label>
			   <input type="date"
			          name="endDate">

        <button type="submit" class="update-btn">
            更新
        </button>

        <a href="/tasks" class="cancel-btn">
            ← キャンセル
        </a>

    </form>

</div>

</body>
</html>
