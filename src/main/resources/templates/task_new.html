<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>タスク新規作成</title>

<style>

body {
    background-color: #f5f5f5;
    font-family: sans-serif;
}

.container {
    width: 900px;
    margin: 50px auto;
}

h1 {
    font-size: 48px;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 14px;
    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 14px;
}

textarea {
    height: 120px;
    resize: vertical;
}

.btn-area {
    margin-top: 25px;
}

.save-btn {
    background-color: #198754;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

.cancel-btn {
    background-color: #6c757d;
    color: white;
    padding: 10px 18px;
    border-radius: 4px;
    text-decoration: none;
    margin-left: 10px;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

    <h1>タスク新規作成</h1>

    <form action="/tasks" method="post">

        <div class="form-group">
            <label>タイトル</label>
            <input type="text" name="title">
        </div>

        <div class="form-group">
            <label>内容</label>
            <textarea name="content"></textarea>
        </div>

        <div class="form-group">
            
        </div>

        <div class="form-group">
            <label>開始日</label>
            <input type="date" name="startDate">
        </div>

        <div class="form-group">
            <label>終了日</label>
            <input type="date" name="endDate">
        </div>

        <div class="btn-area">
            <button type="submit" class="save-btn">完了</button>
            <a href="/tasks" class="cancel-btn">← キャンセル</a>
        </div>

    </form>

</div>

</body>
</html>
