<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>ユーザ登録</title>

<style>

body {
    background-color: #f2f2f2;
    font-family: sans-serif;
}

.container {
    width: 300px;
    margin: 100px auto;
}

.register-box {
    background-color: white;
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 48px;
}

.error-message {
    background-color: #f8d7da;
    color: #842029;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 13px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
}

input {
    width: 100%;
    height: 35px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding-left: 10px;
    box-sizing: border-box;
}

.register-btn {
    width: 100%;
    height: 40px;
    background-color: #198754;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 10px;
}

.login-link {
    text-align: center;
    margin-top: 15px;
}

.login-link a {
    color: #0d6efd;
    text-decoration: none;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

    <div class="register-box">

        <h1>ユーザ登録</h1>

        <div th:if="${errorMessage}"
             class="error-message"
             th:text="${errorMessage}">
        </div>

        <form action="/register" method="post">

            <div class="form-group">
                <label>ユーザ名（半角英字）</label>
                <input type="text" name="username">
            </div>

            <div class="form-group">
                <label>パスワード（半角英数字）</label>
                <input type="password" name="password">
            </div>

            <button type="submit" class="register-btn">
                登録
            </button>

        </form>

        <div class="login-link">
            <a href="/login">ログインはこちら</a>
        </div>

    </div>

</div>

</body>

</html>
