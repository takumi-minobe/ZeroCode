<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>パスワード変更</title>

<style>
body {
    background: #f4f7fb;
    font-family: sans-serif;
}

.container {
    width: 700px;
    margin: 60px auto;
    background: white;
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #0d3b66;
    font-size: 32px;
    margin-bottom: 30px;
}

.success {
    background: #e8f8ee;
    color: #198754;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 25px;
    text-align: center;
}

.error {
    background: #fdecea;
    color: #dc3545;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 25px;
    text-align: center;
}

.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

label {
    width: 220px;
    font-weight: bold;
}

input[type="password"] {
    flex: 1;
    height: 40px;
    border: 1px solid #ccd3dc;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 14px;
}

.change-area {
    text-align: center;
    margin-top: 30px;
}

.change-btn {
    background: #0d6efd;
    color: white;
    border: none;
    padding: 12px 60px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.change-btn:hover {
    background: #0b5ed7;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #6f42c1;
    font-weight: bold;
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container">

    <h2>🔒 パスワード変更</h2>

    <div th:if="${error}" th:text="${error}" class="error"></div>
    <div th:if="${message}" th:text="${message}" class="success"></div>

    <form th:action="@{/password/change}" method="post">

        <div class="form-row">
            <label>現在のパスワード</label>
            <input type="password" name="currentPassword">
        </div>

        <div class="form-row">
            <label>新しいパスワード</label>
            <input type="password" name="newPassword">
        </div>

        <div class="form-row">
            <label>新しいパスワード確認</label>
            <input type="password" name="confirmPassword">
        </div>

        <div class="change-area">
            <button type="submit" class="change-btn">🔒 変更する</button>
        </div>

    </form>

    <a th:href="@{/tasks}" class="back-link">← TODO一覧へ戻る</a>

</div>

</body>
</html>
