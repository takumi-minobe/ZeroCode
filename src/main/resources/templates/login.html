<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>ログイン</title>

<style>
body {
    background-color: #f2f2f2;
    font-family: sans-serif;
}

.container {
    width: 300px;
    margin: 120px auto;
    text-align: center;
}

h1 {
    margin-bottom: 30px;
    font-size: 48px;
}

.login-box {
    background-color: white;
    padding: 20px;
    border-radius: 5px;
    border: 1px solid #ddd;
}

.error-message {
    background-color: #f8d7da;
    color: #842029;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 15px;
    font-size: 13px;
}

.form-group {
    text-align: left;
    margin-bottom: 15px;
}

label {
    font-size: 12px;
}

input {
    width: 100%;
    height: 35px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding-left: 10px;
    box-sizing: border-box;
}

.login-btn {
    width: 100%;
    height: 40px;
    background-color: #0d6efd;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <h1>ログイン</h1>

    <div class="login-box">

        <div th:if="${errorMessage}"
             class="error-message"
             th:text="${errorMessage}">
        </div>

        <form action="/login" method="post">

            <div class="form-group">
                <label>ユーザー名</label>
                <input type="text" name="username">
            </div>

            <div class="form-group">
                <label>パスワード</label>
                <input type="password" name="password">
            </div>

            <button type="submit" class="login-btn">
                ログイン
            </button>

        </form>

    </div>

</div>

</body>
</html>
